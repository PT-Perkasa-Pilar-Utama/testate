# Production compose. Copy this directory, fill .env from .env.example, then:
#   docker compose up -d
# The image writes only under /data (metadata.db, blobs, logs, uploads, run/).
services:
  testate:
    image: ghcr.io/pt-perkasa-pilar-utama/testate:latest
    env_file: .env
    ports:
      - "7378:7378"
    volumes:
      - testate-data:/data
    restart: unless-stopped
    # A database installed on the host rather than in a container: point the adapter at
    # host.docker.internal, never 127.0.0.1, which in here means this container. The database
    # must also listen on that interface, and the deny list keeps loopback blocked on purpose.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    read_only: true
    # Nothing in the image needs a capability: the port is above 1024 and the process is `bun`.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # SIGTERM lets running jobs roll back; the API waits up to 30 s (spec 22 §22.4).
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  testate-data:
