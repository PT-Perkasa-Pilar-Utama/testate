# Reverse proxy example: Testate served under https://example.internal/testate
# Matching .env: TESTATE_BASE_PATH=/testate, TESTATE_TRUST_PROXY=true,
# TESTATE_PUBLIC_URL=https://example.internal/testate

upstream testate {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name example.internal;

    ssl_certificate     /etc/nginx/certs/example.internal.crt;
    ssl_certificate_key /etc/nginx/certs/example.internal.key;

    # Imports and state archives: keep above TESTATE_MAX_UPLOAD_MB.
    client_max_body_size 64m;

    location /testate/ {
        proxy_pass http://testate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;

        # Job event streams (SSE) and long checkouts: no buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /testate {
        return 301 /testate/;
    }
}
