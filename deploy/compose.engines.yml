# Target engines for development and the contract tests. Not for production.
#   docker compose -f deploy/compose.engines.yml up -d
# Ports are offset so they never collide with a local install.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testate
      POSTGRES_PASSWORD: testate
      POSTGRES_DB: shop
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testate -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Below the Postgres floor of 13. Only the connection test talks to it (story 20).
  postgres-old:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: testate
      POSTGRES_PASSWORD: testate
      POSTGRES_DB: shop
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testate -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: testate
      MYSQL_DATABASE: shop
      MYSQL_USER: testate
      MYSQL_PASSWORD: testate
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestate"]
      interval: 5s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: testate
      MARIADB_DATABASE: shop
      MARIADB_USER: testate
      MARIADB_PASSWORD: testate
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: testate
      MONGO_INITDB_ROOT_PASSWORD: testate
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testate
      MINIO_ROOT_PASSWORD: testate-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 testate testate-minio &&
      mc mb --ignore-existing local/exports &&
      echo ready"

  sftp:
    image: atmoz/sftp:alpine
    command: testate:testate:1001::upload
    ports:
      - "22220:22"

  ftp:
    image: delfer/alpine-ftp-server
    environment:
      USERS: "testate|testate|/ftp/testate|1001"
      ADDRESS: 127.0.0.1
      MIN_PORT: 21100
      MAX_PORT: 21110
    # The image's own adduser cannot create this home directory, so on a fresh stack the container
    # dies with "adduser: /ftp/testate: No such file or directory" and every ftp contract test
    # skips. Docker creates a mount point before the entrypoint runs, so the volume is what makes
    # the directory exist.
    volumes:
      - ftp-home:/ftp/testate
    ports:
      - "21210:21"
      - "21100-21110:21100-21110"
    # The image's supervisor quits if vsftpd is not up in time, which it often is not on a cold
    # stack starting eight containers at once. It always survives the next attempt, so let Docker
    # make that attempt instead of leaving the suite to find a dead container.
    restart: on-failure
    # Without this `up --wait` only waits for "running", and a container that dies a moment later
    # still counts as started. That is how a dead ftp reached the test run.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ftp-home:
