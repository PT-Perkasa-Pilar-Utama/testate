# Weekly update pull requests for the workspace's packages (bun.lock) and for the actions the
# workflows pin by commit SHA, so the pins keep moving without anyone watching release feeds.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # pm2 for the release smoke test (scripts/binary/smoke-service.sh), pinned by its own lockfile.
  - package-ecosystem: "npm"
    directory: "/scripts/binary/pm2"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request for every action, not one per action: CodeQL's init, analyze and
    # upload-sarif have to move together, and three separate bumps each failed the others' checks.
    groups:
      actions:
        patterns: ["*"]
