name: Deploy image

# Manually-triggered. Reads the version from package.json and skips entirely if
# that version is already published - bump the version to release.
on:
  workflow_dispatch:

# Least-privilege default; the jobs opt into the `packages: write` they need
# to push to ghcr.io.
permissions:
  contents: read

jobs:
  # One job per architecture, each on a native runner. Emulated builds of Bun are slow and have
  # their own failure modes, and docker-slim cannot slim a manifest list anyway: it works on one
  # loaded image. So each arch is built, profiled and slimmed where it runs, pushed by digest, and
  # the merge job below joins the digests under the real tags.
  build:
    name: Build and slim (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            slim_asset: dist_linux.tar.gz
          - arch: arm64
            runner: ubuntu-24.04-arm
            slim_asset: dist_linux_arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name + version
        id: img
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          version=$(jq -r .version package.json)
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved ghcr.io/${repo}:${version} for linux/${{ matrix.arch }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: published
        run: |
          if docker manifest inspect "${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}" > /dev/null 2>&1; then
            echo "::notice::${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }} already exists - skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `load` rather than `platforms`: the runner is already the target architecture, and the
      # slim step needs the image in the local daemon.
      - name: Build fat image
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: testate:fat
          build-args: |
            VERSION=${{ steps.img.outputs.version }}

      # Boot refuses without a sealed-values key and a bootstrap password, so the
      # profiling run gets throwaway values through an env file. Nothing from this
      # run ends up in the image: docker-slim only records which files were touched.
      - name: Write profiling env
        if: steps.published.outputs.skip != 'true'
        run: |
          {
            echo "TESTATE_ENV=test"
            echo "TESTATE_SECRETS_ACTIVE_KEY=$(openssl rand -base64 32)"
            echo "TESTATE_ADMIN_PASSWORD=profiling-only-password"
            echo "TESTATE_LOG_STDOUT=false"
          } > profile.env

      # The container boots, migrates SQLite, rewrites the SPA assets, and answers
      # the probes, so docker-slim sees every file the runtime actually uses.
      # /app is force-kept so migrations and web assets survive whatever the probes miss.
      # Slim's own binary rather than an action wrapping it. The wrapper only downloaded this and
      # ran it, and it is stuck on Node 20, which the runners now force onto Node 24 with a warning
      # on every job. Calling it directly drops that warning and one third-party action.
      - name: Slim the image
        if: steps.published.outputs.skip != 'true'
        env:
          SLIM_VERSION: "1.40.11"
        run: |
          curl -fsSL -o slim.tar.gz \
            "https://github.com/slimtoolkit/slim/releases/download/${SLIM_VERSION}/${{ matrix.slim_asset }}"
          tar -xzf slim.tar.gz
          # The tool was renamed: the archive holds `mint`, and `slim` is a symlink to it that a
          # search for regular files walks straight past. Either name is the same binary.
          slim_bin="$(find . -maxdepth 3 -type f \( -name mint -o -name slim \) -perm -u+x | head -1)"
          if [ -z "$slim_bin" ]; then
            echo "::error::the slim ${SLIM_VERSION} archive did not contain a mint or slim binary"
            exit 1
          fi
          # One --http-probe-cmd per path: the flag repeats, it does not take a list.
          "$slim_bin" build \
            --target testate:fat \
            --tag testate:slim \
            --http-probe \
            --http-probe-cmd /api/v1/health/live \
            --http-probe-cmd /api/v1/health/ready \
            --http-probe-cmd /api/v1/health \
            --http-probe-cmd /api/v1/openapi.json \
            --http-probe-cmd / \
            --http-probe-cmd /login \
            --continue-after 20 \
            --include-path /app \
            --env-file profile.env

      # docker-slim drops /data. It is empty in the image (the app writes into it at runtime and
      # the volume hides it), so nothing touched it during profiling. Without the directory Docker
      # creates the volume's mount point as root, the container runs as `bun`, and boot refuses
      # with "TESTATE_DATA_DIR is not writable: /data/blobs". Putting the directory back is enough:
      # a fresh named volume inherits the ownership of the path it covers.
      - name: Put back the data directory the slim step drops
        if: steps.published.outputs.skip != 'true'
        run: |
          mkdir -p .slim-data-keep
          printf 'FROM testate:slim\nCOPY --chown=bun:bun .slim-data-keep/ /data/\n' > Dockerfile.slim-data
          docker build -f Dockerfile.slim-data -t testate:slim .

      # It boots on the architecture it was built for before anything is pushed. An image that
      # cannot start is worth catching here rather than after someone pulls it.
      - name: Prove the slimmed image boots
        if: steps.published.outputs.skip != 'true'
        run: |
          docker run -d --name smoke -p 7378:7378 -v smoke-data:/data \
            -e TESTATE_SECRETS_ACTIVE_KEY="$(openssl rand -base64 32)" \
            -e TESTATE_ADMIN_PASSWORD=deploy-smoke-password-1 \
            testate:slim
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7378/api/v1/health/live || true)
            [ "$code" = "204" ] && break
            sleep 2
          done
          if [ "$code" != "204" ]; then
            echo "::error::the slimmed ${{ matrix.arch }} image did not answer /health/live; it returned '$code'"
            docker logs smoke
            exit 1
          fi
          echo "linux/${{ matrix.arch }} answered 204 on a fresh volume"
          docker rm -f smoke

      # Cheap insurance: the slim run drives the Docker daemon, and a re-login costs nothing
      # next to a push that fails after the image is already built.
      - name: Re-login to GitHub Container Registry
        if: steps.published.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest under a throwaway tag, never under the release tag: a per-arch tag would
      # publish a single-platform image at the name people pull, which is the thing this whole
      # change exists to stop.
      - name: Push this architecture by digest
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          staging="${{ steps.img.outputs.image }}:staging-${{ steps.img.outputs.version }}-${{ matrix.arch }}"
          docker tag testate:slim "$staging"
          # Read the digest off the push itself. `docker inspect` reports RepoDigests, which can
          # hold more than one entry once an image has been tagged into several repositories.
          digest=$(docker push "$staging" | awk '/digest: sha256:/ { print $3 }')
          if [ -z "$digest" ]; then
            echo "::error::the push did not report a digest for linux/${{ matrix.arch }}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed linux/${{ matrix.arch }} as ${digest}"

      - name: Record the digest for the merge job
        if: steps.published.outputs.skip != 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - name: Upload the digest
        if: steps.published.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  # One manifest list over both digests, published under the version and `latest`. Until this job
  # runs, the only tags on the registry are the staging ones, so a half-finished deploy never
  # leaves a single-architecture image at the name people pull.
  merge:
    name: Publish the multi-architecture tags
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and the provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name + version
        id: img
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          version=$(jq -r .version package.json)
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the digests
        id: digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Join both architectures under the release tags
        run: |
          if [ ! -f digests/amd64 ] || [ ! -f digests/arm64 ]; then
            echo "::notice::no digests to merge; the version was already published."
            exit 0
          fi
          image="${{ steps.img.outputs.image }}"
          version="${{ steps.img.outputs.version }}"
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            "${image}@$(cat digests/amd64)" \
            "${image}@$(cat digests/arm64)"
          echo "published ${image}:${version} for linux/amd64 and linux/arm64"

      - name: Confirm both platforms are in the published manifest
        run: |
          if [ ! -f digests/amd64 ]; then exit 0; fi
          # Read the platforms out of the JSON rather than grepping it: `--raw` is pretty-printed,
          # so a pattern like "architecture":"amd64" matches nothing and the check fails on a
          # manifest that is perfectly correct.
          platforms=$(docker buildx imagetools inspect --raw "${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}" \
            | jq -r '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')
          echo "published platforms: ${platforms:-none}"
          for arch in amd64 arm64; do
            case ",${platforms}," in
              *",${arch},"*) ;;
              *)
                echo "::error::linux/${arch} is missing from the published manifest"
                exit 1
                ;;
            esac
          done
          echo "manifest carries linux/amd64 and linux/arm64"

      - name: Resolve the published digest
        id: published
        run: |
          if [ ! -f digests/amd64 ]; then echo "digest=" >> "$GITHUB_OUTPUT"; exit 0; fi
          digest=$(docker buildx imagetools inspect "${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}" --format '{{ json .Manifest.Digest }}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published manifest is ${digest}"

      # SLSA build provenance for the image, stored in the registry beside it. Verify with:
      #   gh attestation verify oci://ghcr.io/pt-perkasa-pilar-utama/testate:<version> --repo PT-Perkasa-Pilar-Utama/testate
      - name: Attest the image's build provenance
        if: steps.published.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: steps.published.outputs.digest != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless, through the workflow's OIDC identity: no long-lived key anywhere. Verify with:
      #   cosign verify ghcr.io/pt-perkasa-pilar-utama/testate:<version> \
      #     --certificate-identity-regexp 'https://github.com/PT-Perkasa-Pilar-Utama/testate/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image (keyless)
        if: steps.published.outputs.digest != ''
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.img.outputs.image }}@${{ steps.published.outputs.digest }}"

  # One executable per platform, the SPA and the migrations inside it, so a machine with no Docker
  # can run Testate from a download. Cross-compiled on one Linux runner: nothing native is inside
  # the bundle (`*.node` stays external and ssh2 falls back to its pure-JS crypto).
  binaries:
    name: Build the single binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # In lockstep with ci.yml: the binaries embed this exact runtime.
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Compile every target
        run: bun scripts/binary/build-binaries.ts --all

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: .bin-build/testate-*
          if-no-files-found: error
          # .bin-build is a dot-directory; the default hidden-file filter would match nothing.
          include-hidden-files: true
          retention-days: 7

  # Each binary boots on its own operating system before anything is published: the data
  # directory is created, the migrations run from the unpacked copy, and the SPA is served.
  smoke:
    name: Boot the binary (${{ matrix.target }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            suffix: ""
          - os: macos-latest
            target: darwin-arm64
            suffix: ""
          - os: windows-latest
            target: windows-x64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: binaries

      - name: Boot it and ask for the health line and the SPA
        shell: bash
        run: |
          version=$(jq -r .version package.json)
          bin="./binaries/testate-${version}-${{ matrix.target }}${{ matrix.suffix }}"
          chmod +x "$bin"
          mkdir -p data
          PORT=7378 TESTATE_ENV=test TESTATE_DATA_DIR=./data \
            TESTATE_SECRETS_ACTIVE_KEY="$(openssl rand -base64 32)" \
            TESTATE_ADMIN_PASSWORD=binary-smoke-password-1 \
            "$bin" > boot.log 2>&1 &
          pid=$!
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7378/api/v1/health/live || true)
            [ "$code" = "204" ] && break
            sleep 2
          done
          if [ "$code" != "204" ]; then
            echo "::error::the ${{ matrix.target }} binary did not answer /health/live; it returned '$code'"
            cat boot.log
            exit 1
          fi
          curl -s http://127.0.0.1:7378/ | grep -q "<title>Testate</title>"
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:7378/fonts/mona-sans.woff2 | grep -q 200
          echo "${{ matrix.target }} booted, served the SPA and its fonts"
          kill $pid

  # The release for this version, with GitHub's own generated notes and the binaries attached.
  # Idempotent like the image: an existing release for the version is left alone.
  release:
    name: Publish the release
    needs: [merge, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless signing and the provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: binaries

      # Archives, not bare executables: a 60 MB binary gzips to a third, and the archive keeps
      # the executable bit on macOS and Linux.
      - name: Compress for distribution
        run: |
          mkdir -p dist
          for f in binaries/testate-*; do
            name=$(basename "$f")
            case "$name" in
              *.exe) (cd binaries && zip -q "../dist/${name%.exe}.zip" "$name") ;;
              *)     tar czf "dist/${name}.tar.gz" -C binaries "$name" ;;
            esac
          done
          ls -lh dist

      # SLSA build provenance for each archive. Verify a download with:
      #   gh attestation verify testate-<version>-<target>.tar.gz --repo PT-Perkasa-Pilar-Utama/testate
      # Before signing, so the subject glob cannot match the bundles the signing step adds.
      - name: Attest the archives' build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The same statement as a release asset, under the name the SLSA tooling and Scorecard's
      # Signed-Releases check look for, so a reader without `gh` can verify it offline:
      #   gh attestation verify testate-<version>-<target>.tar.gz --bundle testate-<version>.intoto.jsonl --repo ...
      - name: Attach the provenance bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" "dist/testate-$(jq -r .version package.json).intoto.jsonl"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One .sigstore.json bundle per archive: signature, certificate and transparency-log entry
      # in one file, which is also what Scorecard's Signed-Releases check looks for.
      - name: Sign the archives (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json"
          done

      # What is inside: every package the binaries and the image carry, as CycloneDX.
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/testate-sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create the release, unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::release ${tag} already exists - leaving it alone."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --target "${{ github.sha }}" \
            dist/*
          echo "published ${tag} with $(ls dist | wc -l) assets"
