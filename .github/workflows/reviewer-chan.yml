name: reviewer-chan

# Request a review from the "reviewer-chan" team on a PR, and the Reviewer-chan app posts a
# tech-lead review. The job itself lives in PT-Perkasa-Pilar-Utama/reviewer-chan.
# pull_request_target runs this file from the base branch, so a PR cannot change it.
on:
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  review:
    # The job reads both secrets from this repo's reviewer-chan environment, limited to main.
    uses: PT-Perkasa-Pilar-Utama/reviewer-chan/.github/workflows/review.yml@a9dc5d3801d66936ac6f39381de5042a45a255f5 # v1.2.0
    with:
      daily_cap: 10
