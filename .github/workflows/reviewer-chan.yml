name: reviewer-chan

# Request a review from the "reviewer-chan" team on a PR, and the Reviewer-chan app posts a
# tech-lead review. The job itself lives in PT-Perkasa-Pilar-Utama/review-chan-setup.
# pull_request_target runs this file from the base branch, so a PR cannot change it.
on:
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  review:
    uses: PT-Perkasa-Pilar-Utama/review-chan-setup/.github/workflows/review.yml@main
    with:
      daily_cap: 10
    secrets:
      # The repo tech lead's token (docs/03-token.md in review-chan-setup).
      claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_ENGINEERPPU }}
      reviewer_chan_key: ${{ secrets.REVIEWER_CHAN_PRIVATE_KEY }}
