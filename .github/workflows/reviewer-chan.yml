name: reviewer-chan

# Request a review from the "reviewer-chan" team on a PR, and the Reviewer-chan app posts a
# tech-lead review. The job itself lives in PT-Perkasa-Pilar-Utama/reviewer-chan.
# pull_request_target runs this file from the base branch, so a PR cannot change it.
on:
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  review:
    uses: PT-Perkasa-Pilar-Utama/reviewer-chan/.github/workflows/review.yml@231a78e02d0af9f954d396157945577aa987db5a # v1.3.0
    with:
      daily_cap: 10
      # A review request to the tech lead also starts Reviewer-chan.
      also_on_reviewer: snowfluke
    # A called workflow sees a secret only when it is passed or inherited; the job's
    # reviewer-chan environment then supplies the value. The job reads only its two secrets.
    secrets: inherit
