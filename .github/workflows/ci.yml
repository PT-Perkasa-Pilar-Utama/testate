name: ci

# Every push runs the fast gate: the same `complete-check` the pre-push hook runs, plus a boot.
# The slow jobs, the engine contract suites, the browser suite and the image build, run on pull
# requests, on a version tag, and on demand, so a push to main does not pay for them. A pull
# request that touches only documentation runs the fast gate alone (`changes` below).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token for every job; none of them writes to the repository.
permissions:
  contents: read

jobs:
  # A pull request that touches only documentation (`docs/` and Markdown, the same rule the e2e
  # shard keys use in e2e/lib/shards.ts) skips the slow jobs: none of them reads those files. A
  # skipped job still answers a required check. Pushes and tags always run everything they run.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # HEAD is the merge of the pull request into its base; its first parent is that base.
          changed=$(git diff --name-only HEAD^1 HEAD)
          # No `grep -q`: it exits on the first match, and under pipefail that fails the pipeline.
          code_files=$(printf '%s\n' "$changed" | grep -vE '^docs/|\.md$' || true)
          if [ -n "$code_files" ]; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::code changed: $code"

  check:
    name: type-check, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Bun's package cache, keyed on the lockfile: an install from it takes seconds, one from the
      # registry took up to forty on a cold runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run complete-check
      # The install script runs under dash and busybox, so POSIX sh is the dialect checked.
      # ShellCheck ships on the Ubuntu runner image.
      - name: shellcheck the install, packaging and smoke scripts
        run: shellcheck -s sh docs/install.sh scripts/binary/*.sh

  smoke:
    name: boot and smoke
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Bun's package cache, keyed on the lockfile: an install from it takes seconds, one from the
      # registry took up to forty on a cold runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: boot the built API
        env:
          TESTATE_ENV: test
          TESTATE_DATA_DIR: ${{ runner.temp }}/testate-data
          TESTATE_ADMIN_PASSWORD: change-me-on-first-login
          TESTATE_LOG_STDOUT: "false"
          TESTATE_LOG_RETENTION_DAYS: "1"
        run: |
          export TESTATE_SECRETS_ACTIVE_KEY="$(bun scripts/generate-key.ts)"
          bun apps/api/dist/index.js &
          echo $! > api.pid
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:7378/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1
      - run: bun run smoke
      - name: stop the API
        if: always()
        run: kill "$(cat api.pid)" || true
      # The CLI from the README on a real systemd, on the pull request rather than at release:
      # setup twice, a per-user service, whereis, uninstall (docs/decisions/2026-10-10-cli.md).
      - name: compile the binary for this runner
        run: bun scripts/binary/build-binaries.ts --skip-web
      - name: setup and a per-user service from the binary
        run: sh scripts/binary/smoke-cli.sh .bin-build/linux_amd64/testate

  image:
    name: docker build
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: testate:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contract:
    name: engine contract suites
    # The engines it needs cost a compose start, so it rides with the other slow jobs: pull
    # requests, version tags, and on demand. `bun run contract` fails on a skipped suite, which
    # is how these came to never run at all.
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image pulls are the slowest thing in this job, so they start first and run while Bun
      # installs; the wait below finds them already up.
      - name: pull and start the compose engines
        run: |
          docker compose -f deploy/compose.engines.yml up -d \
            postgres postgres-old mysql mariadb mongo minio sftp ftp
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Bun's package cache, keyed on the lockfile: an install from it takes seconds, one from the
      # registry took up to forty on a cold runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `--wait` fails as soon as one container is unhealthy, and the ftp image is known to need a
      # few restarts on a cold stack (`restart: always` in the compose file) before vsftpd answers.
      # One retry five seconds later was not enough on CI, so it gets five tries ten seconds apart,
      # and a last failure prints the state and the file servers' logs instead of a bare exit 1.
      - name: start the compose engines
        run: |
          up() {
            docker compose -f deploy/compose.engines.yml up -d --wait \
              postgres postgres-old mysql mariadb mongo minio sftp ftp
          }
          for try in 1 2 3 4 5; do
            up && exit 0
            echo "::warning::engines not healthy on try $try"
            sleep 10
          done
          docker compose -f deploy/compose.engines.yml ps
          docker compose -f deploy/compose.engines.yml logs --tail 50 ftp sftp
          exit 1
      - name: create the MinIO bucket
        run: docker compose -f deploy/compose.engines.yml run --rm minio-init
      - run: bun run contract
      - name: stop the compose engines
        if: always()
        run: docker compose -f deploy/compose.engines.yml down -v

  # Four shards on four runners, each with its own engines and a fresh instance (#40). A flaky
  # shard is re-run alone with "Re-run failed jobs", and a shard that already passed on the same
  # inputs skips itself: its key hashes every tracked file it depends on (e2e/lib/shards.ts).
  e2e:
    name: browser end-to-end (${{ matrix.shard }})
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [check, changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [screens, flows, states, tail, bundle]
    env:
      E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Bare Bun, before any install: the key script imports nothing but the shard table.
      - name: shard input key
        id: key
        run: echo "key=e2e-pass-${{ matrix.shard }}-$(bun e2e/lib/shard-key.ts "$E2E_SHARD")" >> "$GITHUB_OUTPUT"
      - name: passed before on these inputs?
        id: passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-pass
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      # A pass is cached per pull request, and main runs no e2e, so a new pull request never finds
      # one. Its base passed this shard when it merged, though: if the shard's inputs are the same
      # as the base's, this pull request changed nothing the shard reads.
      - name: same inputs as the base?
        id: base
        if: github.event_name == 'pull_request'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          git worktree add -q ../base HEAD^1
          base="e2e-pass-$E2E_SHARD-$(cd ../base && bun e2e/lib/shard-key.ts "$E2E_SHARD" || echo none)"
          if [ "$base" = "$KEY" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
      - name: run this shard?
        id: run
        env:
          HIT: ${{ steps.passed.outputs.cache-hit }}
          SAME: ${{ steps.base.outputs.same }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "::notice::$E2E_SHARD passed before on these inputs; skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$SAME" = "true" ]; then
            echo "::notice::$E2E_SHARD reads nothing this pull request changed; skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The image pulls are the slowest thing in this job, so they start first and run while Bun
      # installs; the wait below finds them already up.
      - name: pull and start the compose engines
        if: steps.run.outputs.run == 'true'
        run: |
          docker compose -f deploy/compose.engines.yml up -d \
            postgres postgres-old mysql mariadb mongo minio sftp ftp
      # Bun's package cache, keyed on the lockfile: an install from it takes seconds, one from the
      # registry took up to forty on a cold runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.run.outputs.run == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: steps.run.outputs.run == 'true'
      # `--wait` fails as soon as one container is unhealthy, and the ftp image is known to need a
      # few restarts on a cold stack (`restart: always` in the compose file) before vsftpd answers.
      # One retry five seconds later was not enough on CI, so it gets five tries ten seconds apart,
      # and a last failure prints the state and the file servers' logs instead of a bare exit 1.
      - name: start the compose engines
        if: steps.run.outputs.run == 'true'
        run: |
          up() {
            docker compose -f deploy/compose.engines.yml up -d --wait \
              postgres postgres-old mysql mariadb mongo minio sftp ftp
          }
          for try in 1 2 3 4 5; do
            up && exit 0
            echo "::warning::engines not healthy on try $try"
            sleep 10
          done
          docker compose -f deploy/compose.engines.yml ps
          docker compose -f deploy/compose.engines.yml logs --tail 50 ftp sftp
          exit 1
      # `--wait` fails on a container that exits, however cleanly, so the one-shot bucket
      # creation runs on its own and answers with its own exit code.
      - name: create the MinIO bucket
        if: steps.run.outputs.run == 'true'
        run: docker compose -f deploy/compose.engines.yml run --rm minio-init
      # The seeded demo adapters point at `shop` on each engine, and the tables in it are created
      # by the contract suites, which run on their own stack in another job. A fresh stack here has
      # an empty `shop`, so every adapter would introspect zero tables. Each suite drops and
      # recreates its own schema, so running them first is idempotent.
      - name: create the demo schema in the engines
        if: steps.run.outputs.run == 'true'
        run: bun run contract
      # `boot.e2e.ts` starts an instance from `apps/api/dist/index.js` on purpose: story 123 is
      # about the artifact the image runs, not the sources. Nothing else in this job builds it.
      - run: bun run build
        if: steps.run.outputs.run == 'true'
      - run: bun run e2e
        if: steps.run.outputs.run == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.run.outputs.run == 'true'
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            .e2e/report
            .e2e/results
            .e2e/crawl
          if-no-files-found: ignore
      - name: stop the compose engines
        if: always()
        run: docker compose -f deploy/compose.engines.yml down -v
      - name: record the pass
        if: success() && steps.run.outputs.run == 'true'
        run: mkdir -p .e2e-pass && echo "${{ github.sha }}" > .e2e-pass/passed
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.run.outputs.run == 'true'
        with:
          path: .e2e-pass
          key: ${{ steps.key.outputs.key }}

  # The ruleset requires a check called "browser end-to-end"; the shards answer through this one.
  e2e-result:
    name: browser end-to-end
    if: always() && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      # Skipped when the pull request touches only documentation.
      - name: every shard passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = "success" || test "$RESULT" = "skipped"
