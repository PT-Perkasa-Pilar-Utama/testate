<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Testate runs in Docker on the DEV, SIT, or UAT server next to the main service and its database; a reverse proxy exposes it to admins, viewers, testers, CI/CD, and AI agents">
  <defs>
    <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#111827"/>
    </marker>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#EAF7EC"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#BFE5C6" stroke-width="3"/>
    </pattern>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 30px; font-weight: 600; }
      .small { font-size: 26px; font-weight: 600; }
      .box { fill: #FFFFFF; stroke: #111827; stroke-width: 4; }
      .line { fill: none; stroke: #111827; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#F8F9FA"/>

  <!-- Server -->
  <text class="t title" x="700" y="110" text-anchor="middle">DEV/SIT/UAT Server</text>
  <rect class="box" x="500" y="150" width="400" height="620" rx="18"/>

  <rect class="box" x="540" y="190" width="320" height="140" rx="14"/>
  <text class="t label" x="700" y="270" text-anchor="middle">Main service</text>

  <rect class="box" x="540" y="370" width="320" height="140" rx="14"/>
  <text class="t label" x="700" y="450" text-anchor="middle">Main DB</text>

  <!-- Docker with Testate inside -->
  <rect x="540" y="560" width="320" height="170" rx="14" fill="url(#hatch)" stroke="#4CAF50" stroke-width="4"/>
  <text class="t small" x="562" y="598">Docker</text>
  <rect x="560" y="614" width="280" height="92" rx="14" fill="#F7DCCB" stroke="#E8722E" stroke-width="4"/>
  <text class="t title" x="700" y="672" text-anchor="middle">Testate</text>

  <!-- Testate -> Main DB -->
  <path class="line" d="M700 614 L700 522" marker-end="url(#head)"/>

  <!-- Your system bracket -->
  <path class="line" d="M540 260 L330 260 L330 440 L540 440" stroke-dasharray="18 14"/>
  <text class="t label" x="300" y="360" text-anchor="end">Your system</text>

  <!-- Reverse proxy fan-out -->
  <path class="line" d="M840 660 L960 660"/>
  <text class="t small" x="1030" y="650" text-anchor="middle">reverse</text>
  <text class="t small" x="1030" y="686" text-anchor="middle">proxy</text>

  <path class="line" d="M1000 620 L1130 470" marker-end="url(#head)"/>
  <path class="line" d="M1060 625 L1160 550" marker-end="url(#head)"/>
  <path class="line" d="M1100 660 L1180 660" marker-end="url(#head)"/>
  <path class="line" d="M1060 700 L1160 770" marker-end="url(#head)"/>
  <path class="line" d="M1000 705 L1130 850" marker-end="url(#head)"/>

  <text class="t label" x="1150" y="470">Admin</text>
  <text class="t label" x="1180" y="560">Viewer</text>
  <text class="t label" x="1200" y="671">Tester</text>
  <text class="t label" x="1180" y="781">CI/CD</text>
  <text class="t label" x="1150" y="861">AI Agents</text>
</svg>
