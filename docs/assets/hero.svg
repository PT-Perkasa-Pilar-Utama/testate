<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-labelledby="t d">
<title id="t">Testate. Git for your test database.</title>
<desc id="d">Your test server holds your app and its databases. Testate docks beside them as one container, takes snapshots and puts them back, and testers, developers, CI/CD, DevOps and AI agents come in through it.</desc>
<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter></defs>
<rect width="2400" height="1200" fill="#05070a"/>
<radialGradient id="g1" cx="0.7" cy="0.5" r="0.5"><stop offset="0" stop-color="#7dd3c0" stop-opacity="0.12"/><stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/></radialGradient>
<rect width="2400" height="1200" fill="url(#g1)"/>
<g transform="translate(112 64) scale(0.48)"><g fill="none" stroke="#7dd3c0" stroke-width="9" stroke-linecap="round"><line x1="44" y1="104" x2="44" y2="30"/><path d="M44 66 C44 48 84 60 84 42"/></g><circle cx="44" cy="104" r="11" fill="#7dd3c0"/><circle cx="84" cy="42" r="11" fill="#7dd3c0"/><circle cx="44" cy="30" r="15" fill="#10b981"/><circle cx="44" cy="30" r="6" fill="#0b1017"/></g>
<text x="188" y="108" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" letter-spacing="-0.8" fill="#eef2f5">Test<tspan fill="#10b981">ate</tspan></text>
<text x="120" y="372" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#7dd3c0" letter-spacing="2.6">SELF-HOSTED · V1.0.1 · MIT</text>
<text x="114" y="520" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="150" fill="#eef2f5" font-weight="650" letter-spacing="-5">Git for your</text>
<text x="114" y="670" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="150" fill="#eef2f5" font-weight="650" letter-spacing="-5">test database.</text>
<text x="120" y="770" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#8b96a3" letter-spacing="-0.4">Snapshot the databases behind a system under test.</text>
<text x="120" y="822" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#8b96a3" letter-spacing="-0.4"><tspan fill="#eef2f5" font-weight="550">Break them. Put them back in seconds,</tspan></text>
<text x="120" y="874" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#8b96a3" letter-spacing="-0.4">and see exactly what changed.</text>
<text x="120" y="1060" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#566270">Self-hosted, beside the system it tests. Nothing installs inside your app.</text>
<g transform="translate(980 110) scale(0.88)"><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.0000;0.0008;0.9538;1.0000" dur="13s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0154;0.0769;1.0000" dur="13s" repeatCount="indefinite"/><rect x="440" y="110" width="1110" height="790" rx="26" fill="rgba(238,242,245,0.025)" stroke="rgba(238,242,245,0.28)" stroke-width="1.5" stroke-dasharray="10 8"/><rect x="462" y="94" width="470" height="32" fill="#05070a"/><text x="476" y="118" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="21" fill="#7dd3c0" letter-spacing="2.4">YOUR TEST SERVER · DEV, SIT OR UAT</text><rect x="1120" y="180" width="380" height="140" rx="18" fill="#0b1017" stroke="rgba(238,242,245,0.28)" stroke-width="1.5"/><text x="1310" y="240" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#eef2f5" text-anchor="middle" font-weight="650" letter-spacing="-0.6">Your app</text><text x="1310" y="282" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b96a3" text-anchor="middle">the system under test</text><rect x="1120" y="560" width="380" height="260" rx="18" fill="#0b1017" stroke="rgba(238,242,245,0.28)" stroke-width="1.5"/><text x="1310" y="624" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#eef2f5" text-anchor="middle" font-weight="650" letter-spacing="-0.6">Its databases</text><text x="1310" y="676" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b96a3" text-anchor="middle">PostgreSQL · MySQL · MariaDB</text><text x="1310" y="716" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b96a3" text-anchor="middle">MongoDB · any S3 · SFTP · FTP</text><text x="1310" y="776" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#566270" text-anchor="middle" font-style="italic">reset by hand, until now</text><line x1="1310" y1="320" x2="1310" y2="544" stroke="rgba(238,242,245,0.28)" stroke-width="2"/><polygon points="1310,560 1301,544 1319,544" fill="rgba(238,242,245,0.28)"/><text x="1328" y="446" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b96a3">reads and writes</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1077;0.1308;1.0000" dur="13s" repeatCount="indefinite"/><text x="500" y="300" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7dd3c0">$ docker run ghcr.io/pt-perkasa-pilar-utama/testate</text></g><g transform="translate(-1200 0)"><animateTransform attributeName="transform" type="translate" values="-1200 0;-1200 0;0 0;0 0" keyTimes="0.0000;0.1462;0.2231;1.0000" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1"/><rect x="500" y="330" width="420" height="460" rx="20" fill="#10b981" opacity="0.08" filter="url(#glow)"/><rect x="500" y="330" width="420" height="460" rx="18" fill="#0b1017" stroke="#10b981" stroke-width="1.5"/><g transform="translate(540 366) scale(0.5)"><g fill="none" stroke="#7dd3c0" stroke-width="9" stroke-linecap="round"><line x1="44" y1="104" x2="44" y2="30"/><path d="M44 66 C44 48 84 60 84 42"/></g><circle cx="44" cy="104" r="11" fill="#7dd3c0"/><circle cx="84" cy="42" r="11" fill="#7dd3c0"/><circle cx="44" cy="30" r="15" fill="#10b981"/><circle cx="44" cy="30" r="6" fill="#0b1017"/></g><text x="614" y="412" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#eef2f5" font-weight="650" letter-spacing="-0.8">Test<tspan fill="#10b981">ate</tspan></text><line x1="540" y1="446" x2="880" y2="446" stroke="rgba(238,242,245,0.16)" stroke-width="1.5"/><circle cx="552" cy="484" r="5" fill="#7dd3c0"/><text x="574" y="492" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#eef2f5">snapshot</text><circle cx="552" cy="534" r="5" fill="#7dd3c0"/><text x="574" y="542" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#eef2f5">check out</text><circle cx="552" cy="584" r="5" fill="#7dd3c0"/><text x="574" y="592" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#eef2f5">diff</text><circle cx="552" cy="634" r="5" fill="#7dd3c0"/><text x="574" y="642" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#eef2f5">import fixtures</text><circle cx="552" cy="684" r="5" fill="#7dd3c0"/><text x="574" y="692" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#eef2f5">MCP for agents</text><text x="540" y="742" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#7dd3c0">1 container · 1 volume</text><text x="540" y="772" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8b96a3">Beside the app. Nothing installs inside it.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2462;0.2615;1.0000" dur="13s" repeatCount="indefinite"/><line x1="1120" y1="610" x2="944" y2="610" stroke="#8dd6ff" stroke-width="2.5" stroke-dasharray="176" stroke-dashoffset="176"><animate attributeName="stroke-dashoffset" values="176;176;0;0" keyTimes="0.0000;0.2462;0.