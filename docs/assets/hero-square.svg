<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Testate: git for your test database. Runs in Docker on the DEV, SIT, or UAT server next to your main service and database; a reverse proxy exposes it to admins, viewers, testers, CI/CD, and AI agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="1" stop-color="#0B1F2A"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#CBD5E1"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .group { fill: none; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { stroke-width: 1.5; }
      .edge { fill: none; stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

    <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="620" cy="800" r="520" fill="url(#glowBlue)"/>
  <circle cx="160" cy="260" r="320" fill="url(#glowGreen)"/>
  <g fill="none" stroke="#10B981" stroke-opacity="0.18" stroke-width="1.2">
    <path d="M-20 300 C120 260 220 360 360 320 S600 260 760 340 S1000 300 1220 360"/>
    <path d="M-20 340 C120 300 220 400 360 360 S600 300 760 380 S1000 340 1220 400"/>
  </g>

<!-- Left: brand -->
  <g transform="translate(70 96)">
    <rect width="56" height="56" rx="14" fill="#0F2E3A" stroke="#1F4A55" stroke-width="1.5"/>
    <g fill="none" stroke="#7DD3C0" stroke-width="3.5" stroke-linecap="round">
      <line x1="19" y1="45" x2="19" y2="16"/>
      <path d="M19 32 C19 24 39 29 39 21"/>
    </g>
    <circle cx="19" cy="45" r="4.5" fill="#7DD3C0"/>
    <circle cx="39" cy="21" r="4.5" fill="#7DD3C0"/>
    <circle cx="19" cy="16" r="6" fill="#10B981"/>
    <circle cx="19" cy="16" r="2.5" fill="#0F2E3A"/>
  </g>
  <text class="sans" x="142" y="136" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Testate</text>

  <text class="sans" x="70" y="250" font-size="40" font-weight="700" fill="#F8FAFC" letter-spacing="-0.8">Git for your</text>
  <text class="sans" x="70" y="298" font-size="40" font-weight="700" fill="#F8FAFC" letter-spacing="-0.8">test database.</text>
  <text class="sans" x="560" y="250" font-size="30" font-weight="700" fill="#34D399" letter-spacing="-0.4">Reset the database,</text>
  <text class="sans" x="560" y="298" font-size="30" font-weight="700" fill="#34D399" letter-spacing="-0.4">not the developer.</text>

  <text class="mono" x="560" y="130" font-size="15" fill="#94A3B8">Snapshot the databases behind a system</text>
  <text class="mono" x="560" y="154" font-size="15" fill="#94A3B8">under test, restore them on demand, diff</text>
  <text class="mono" x="560" y="178" font-size="15" fill="#94A3B8">them, import fixtures. One image, one volume.</text>

  <g class="mono" font-size="13" fill="#CBD5E1">
    <g transform="translate(70 340)">
      <circle cx="8" cy="8" r="8" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-width="1.2"/>
      <circle cx="8" cy="8" r="2.5" fill="#34D399"/>
      <text x="24" y="13">Snapshot</text>
    </g>
    <g transform="translate(180 340)">
      <circle cx="8" cy="8" r="8" fill="#3B82F6" fill-opacity="0.18" stroke="#60A5FA" stroke-width="1.2"/>
      <path d="M5 8h6M8.5 5.5L11 8l-2.5 2.5" fill="none" stroke="#60A5FA" stroke-width="1.4" stroke-linecap="round"/>
      <text x="24" y="13">Checkout</text>
    </g>
    <g transform="translate(290 340)">
      <circle cx="8" cy="8" r="8" fill="#A855F7" fill-opacity="0.18" stroke="#C084FC" stroke-width="1.2"/>
      <path d="M5 6h6M5 10h6" fill="none" stroke="#C084FC" stroke-width="1.4" stroke-linecap="round"/>
      <text x="24" y="13">Diff</text>
    </g>
    <g transform="translate(360 340)">
      <circle cx="8" cy="8" r="8" fill="#F97316" fill-opacity="0.18" stroke="#FB923C" stroke-width="1.2"/>
      <path d="M8 4.5v7M5.5 9L8 11.5 10.5 9" fill="none" stroke="#FB923C" stroke-width="1.4" stroke-linecap="round"/>
      <text x="24" y="13">Import</text>
    </g>
  </g>

    <g transform="translate(-500 404)">
<!-- Window card -->
  <rect x="612" y="62" width="948" height="608" rx="22" fill="#000" fill-opacity="0.5" filter="url(#soft)"/>
  <rect x="600" y="56" width="948" height="600" rx="20" fill="url(#card)" stroke="#1F2A3C" stroke-width="1.5"/>
  <rect x="601" y="57" width="946" height="42" rx="20" fill="#0D1526"/>
  <rect x="601" y="80" width="946" height="20" fill="#0D1526"/>
  <line x1="601" y1="99" x2="1547" y2="99" stroke="#1F2A3C" stroke-width="1"/>
  <circle cx="628" cy="78" r="5.5" fill="#F87171"/>
  <circle cx="646" cy="78" r="5.5" fill="#FBBF24"/>
  <circle cx="664" cy="78" r="5.5" fill="#34D399"/>
  <rect x="940" y="66" width="268" height="24" rx="12" fill="#151E30"/>
  <text class="mono" x="1074" y="82" font-size="12" fill="#94A3B8" text-anchor="middle">testate.example.internal/testate</text>
  <rect x="601" y="100" width="946" height="555" fill="url(#grid)" opacity="0.6"/>

  <!-- Server group -->
  <rect class="group" x="640" y="132" width="580" height="486" rx="14" stroke="#60A5FA"/>
  <rect x="640" y="132" width="200" height="30" rx="14" fill="#0B1220"/>
  <text class="sans" x="662" y="153" font-size="14" font-weight="600" fill="#93C5FD">DEV / SIT / UAT server</text>

  <!-- Your system group -->
  <rect class="group" x="668" y="184" width="524" height="176" rx="12" stroke="#A78BFA"/>
  <rect x="668" y="184" width="120" height="28" rx="12" fill="#0B1220"/>
  <text class="sans" x="686" y="204" font-size="13" font-weight="600" fill="#C4B5FD">Your system</text>

  <rect class="node" x="700" y="240" width="220" height="82" rx="10" fill="#131C2E" stroke="#334155"/>
  <text class="sans" x="810" y="276" font-size="16" font-weight="600" fill="#F1F5F9" text-anchor="middle">Main service</text>
  <text class="mono" x="810" y="298" font-size="12" fill="#94A3B8" text-anchor="middle">the app under test</text>

  <rect class="node" x="950" y="240" width="220" height="82" rx="10" fill="#131C2E" stroke="#334155"/>
  <text class="sans" x="1060" y="276" font-size="16" font-weight="600" fill="#F1F5F9" text-anchor="middle">Main DB</text>
  <text class="mono" x="1060" y="298" font-size="12" fill="#94A3B8" text-anchor="middle">SQL engines · MongoDB</text>

  <!-- Docker group -->
  <rect class="group" x="668" y="400" width="524" height="190" rx="12" stroke="#34D399"/>
  <rect x="668" y="400" width="90" height="28" rx="12" fill="#0B1220"/>
  <text class="sans" x="686" y="420" font-size="13" font-weight="600" fill="#6EE7B7">Docker</text>

  <rect x="700" y="452" width="470" height="106" rx="12" fill="#F97316" fill-opacity="0.12" stroke="#FB923C" stroke-width="2"/>
  <g transform="translate(724 476)">
    <rect width="56" height="56" rx="14" fill="#0B1F2A" stroke="#FB923C" stroke-opacity="0.5" stroke-width="1"/>
    <g fill="none" stroke="#7DD3C0" stroke-width="3.5" stroke-linecap="round">
      <line x1="19" y1="45" x2="19" y2="16"/>
      <path d="M19 32 C19 24 39 29 39 21"/>
    </g>
    <circle cx="19" cy="45" r="4.5" fill="#7DD3C0"/>
    <circle cx="39" cy="21" r="4.5" fill="#7DD3C0"/>
    <circle cx="19" cy="16" r="6" fill="#10B981"/>
    <circle cx="19" cy="16" r="2.5" fill="#0B1F2A"/>
  </g>
  <text class="sans" x="800" y="500" font-size="22" font-weight="700" fill="#FFF7ED">Testate</text>
  <text class="mono" x="800" y="524" font-size="12" fill="#FDBA74">snapshot · checkout · diff · import · MCP</text>
  <text class="mono" x="800" y="542" font-size="11" fill="#94A3B8">:3000 · volume /data · any sub-path</text>

  <!-- Testate -> Main DB -->
  <path class="edge" d="M1060 452 L1060 322" marker-end="url(#arrow)"/>
  <text class="mono" x="1068" y="392" font-size="11" fill="#94A3B8">snapshot / restore</text>

  <!-- Reverse proxy -->
  <rect class="node" x="1252" y="480" width="118" height="50" rx="10" fill="#131C2E" stroke="#475569" stroke-dasharray="5 4"/>
  <text class="sans" x="1311" y="510" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">reverse proxy</text>
  <path class="edge" d="M1170 505 L1252 505" marker-end="url(#arrow)"/>

  <!-- Users fan-out -->
  <g class="sans" font-size="13" font-weight="600" fill="#CCFBF1">
    <rect x="1420" y="168" width="104" height="40" rx="9" fill="#0F2E3A" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="1472" y="193" text-anchor="middle">Admin</text>
    <rect x="1420" y="258" width="104" height="40" rx="9" fill="#0F2E3A" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="1472" y="283" text-anchor="middle">Viewer</text>
    <rect x="1420" y="348" width="104" height="40" rx="9" fill="#0F2E3A" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="1472" y="373" text-anchor="middle">Tester</text>
    <rect x="1420" y="438" width="104" height="40" rx="9" fill="#0F2E3A" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="1472" y="463" text-anchor="middle">CI / CD</text>
    <rect x="1420" y="528" width="104" height="40" rx="9" fill="#0F2E3A" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="1472" y="553" text-anchor="middle">AI agents</text>
  </g>
  <g fill="none" stroke="#2DD4BF" stroke-width="1.5">
    <path d="M1370 505 C1398 505 1392 188 1420 188" marker-end="url(#arrowTeal)"/>
    <path d="M1370 505 C1398 505 1392 278 1420 278" marker-end="url(#arrowTeal)"/>
    <path d="M1370 505 C1398 505 1392 368 1420 368" marker-end="url(#arrowTeal)"/>
    <path d="M1370 505 C1398 505 1392 458 1420 458" marker-end="url(#arrowTeal)"/>
    <path d="M1370 505 C1398 505 1392 548 1420 548" marker-end="url(#arrowTeal)"/>
  </g>
  <text class="mono" x="1472" y="600" font-size="11" fill="#64748B" text-anchor="middle">admin · qa · viewer · agent</text>
  </g>
</svg>
